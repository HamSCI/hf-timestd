# HF Time Standard Chrony Refclock Configuration
# Add this to /etc/chrony/chrony.conf or include it via:
#   include /etc/hf-timestd/chrony-timestd-refclocks.conf

# FUSE Feed: HF fusion (multi-broadcast Kalman, L2 calibrated)
# - Multi-station fusion across WWV/WWVH/CHU with L2 calibration applied
# - Uncertainty: ±0.3-1.0ms (ISO GUM uncertainty budget)
# - Latency: ~105-195 seconds
# - Primary HF source when on-host GPS+PPS is absent
#
# `precision 1e-3` matches the ±0.3-1.0 ms above AND what the writer itself
# stamps into the segment: multi_broadcast_fusion computes
# `precision = log2(uncertainty_sec)` per sample from its own measured
# uncertainty.  The line used to assert 1e-4 — ten times better than the
# uncertainty budget on the line above it, and ten times better than the
# writer's own claim.  Nothing consumed the discrepancy, but a config that
# contradicts its own comment is a trap for the next reader.
#
# ⛔ `trust` — AC0G-ND, 2026-09-03.
#
# chrony rejected FUSE as a FALSETICKER (`#x`) while it was, by chrony's OWN
# measurement, the best clock on the station:
#
#     FUSE                       NP=6   Std Dev   348us   Offset  -360us
#     208.70.148.101             NP=30  Std Dev  2661us   Offset   +19ms
#     LAX1.CALTICK.NET           NP=29  Std Dev    13ms   Offset   +23ms
#     149.248.12.167             NP=25  Std Dev    32ms   Offset   +53ms
#     time-usw4.crimpac.net      NP=31  Std Dev    12ms   Offset +6240us
#
# The falseticker test is a MAJORITY VOTE, not a comparison of quality.  Four
# loose internet sources agreeing with each other around +20 ms outvoted one
# tight local source at -0.36 ms, so the station discarded its own metrology
# in favour of consensus among sources 40-100x worse.  `smd timing` reported
# it plainly: `flags chrony-rejected-FUSE:state=x`.
#
# `trust` exempts FUSE from that vote.  It does NOT overstate its accuracy —
# selection still runs on the honest numbers below, which is this file's whole
# principle.  It removes a poll, not a measurement.
#
# What makes that safe is that the authority polices ITSELF: fusion publishes
# only when `quality_ok and multi_station and consistent and discontinuity_ok`
# (uncertainty threshold 5 ms), logs `Chrony feed GATED` with its reasons when
# it will not, and stops updating the segment entirely.  chrony then ages the
# sample out and falls back to the pool with no help from us.  So the network
# remains the backstop for a fusion that doubts itself — it simply stops being
# the electorate for one that does not.
#
# ⛔ THE PRECONDITION — read before keeping `trust`.  AC0G-ND, 2026-09-03.
#
# `trust` is a claim about the FRONT END, not about fusion.  Fusion measures
# WWV/WWVH ticks in SAMPLE time, so an undisciplined ADC scales every
# measurement and FUSE inherits the error — while still reporting itself
# locked, converged and sub-millisecond, because it locks a ONE-SECOND tick and
# therefore measures MODULO ONE SECOND.  An integer-second offset is invisible
# to it, and so is any rate error that has accumulated past a second.
#
# ND's LBE-Mini sat at 8 mA OUT1 drive (the floor of its 8/16/24/32 ladder), so
# the GPSDO's 27 MHz never took over the RX888's reference and the board sampled
# ~350 ppm fast.  With `trust` in force chrony believed FUSE, drove the clock
# 374 ppm fast and walked it TWELVE SECONDS off UTC, marking all three honest
# WAN servers falsetickers.  `chronyc tracking` said stratum 1, 380 us.
# hf-timestd published T3 at -87 us.  radiod's GPS_TIME IS the host clock, so
# every RTP label carried the drift and the station decoded nothing for a day.
#
# ⇒ Fusion's self-gating is honest and blind at the same time.  It cannot see
# the one error class that matters here, so it cannot be the thing that earns
# `trust`.  A GPS-GOVERNED ADC earns it.
#
# VERIFY the precondition — the GPSDO's own status will NOT tell you (ND read
# pll_locked, gps_fix 3D, 17 sats, out1_hz 27000000 throughout).  The arbiter is
# radiod's per-minute "measured sample rate" line (`clock-rate-log = yes`):
#
#     governed:      scatters BOTH WAYS within ~+-20 ppm   (b4: +2.9, -16.4, -2.7)
#     not governed:  consistently ONE-SIDED                (ND was +276..+400)
#
# ⚠ That figure is samples per HOST second, so read it only once the host clock
# is independently verified: `chronyc -n sources`, and confirm the NETWORK rows
# agree in milliseconds, not seconds.
#
# KEEP the WAN pool configured even though T3 outranks it.  It costs nothing and
# it is the only independent witness a T3-only station has.  The asymmetric
# T3<->T2 gross-error rule (METROLOGY.md §4.5) is what polices a fusion gone
# wrong — and note that it silently stopped working here until 2026-09-03,
# because `trust` marks the pool falseticker and the T2 probe would not witness
# a falseticker.  It now witnesses without becoming selectable
# (`ProbeResult.witness_only`).
#
# `smd doctor` reports the failure as `chrony-refclock-captured`.
# Full rationale, including the ordered set-up for a T3-only station:
# METROLOGY.md §4.6 "`trust` on the FUSE refclock — the T3-only station".
refclock SHM 1 refid FUSE poll 4 precision 1e-3 offset 0.0 delay 0.001 trust

# HPPS Feed: HF-PPS via BPSK matched-filter on TS-1 (LB-1421 GPSDO disciplined)
# NOTE: HPPS is NOT a hardware PPS.  It is the HF pulse-per-second recovered
# from the TimeSync-1 BPSK carrier -- the T6 tier.  Hosts running this may have
# no /dev/pps at all.
# - poll 0 = 1s = matches PPS cadence
#
# precision/delay describe the PAIR handed to chrony, NOT the edge estimator.
# Those are different quantities by three orders of magnitude, and conflating
# them is how this line came to assert 5e-6:
#   * the fine stage's own repeatability really is ~5-14 ns, but
#   * what chrony receives is (reference_time, system_time), and system_time
#     comes from the stream hand-off -- transport plus delivery batching --
#     which is millisecond-scale and is what the arrival floor measures.
# Asserting the estimator's precision for the pair produced a 26x overclaim
# (measured Std Dev 1445 us against a claimed +/- 55 us) and, worse, made that
# fiction look like a measurement: the "+/- 55us" column is just
# delay/2 + precision from this line, and it drove three separate
# misdiagnoses that each argued "constant and us-stable, therefore
# instrumental".  See hf-timestd#18 and #7.
#
# Values below are bounded by the arrival floor's measured sigma (~0.8-1.4 ms
# on AC0G-B4).  Never claim better than that here; the recorder derives the
# per-sample precision it pushes from the same floor.
refclock SHM 2 refid HPPS poll 0 precision 1e-3 offset 0.0 delay 0.002

# ⛔ HPPS is deliberately NOT trusted, and that asymmetry is the point.
# FUSE earns `trust` by self-gating on a measured uncertainty budget.  HPPS is
# the T6 tier, which took authority on B4 2026-08-15 and had the offset judge
# screaming 83 ms later; it must keep earning selection against the other
# sources on the honest numbers, majority vote included.  A tier does not
# inherit trust from the file it shares.
#
# Do NOT assume HPPS outranks FUSE.  HPPS bypasses HF fusion uncertainty in the
# EDGE, but pays for it in the hand-off; FUSE measured 17 us Std Dev on B4
# while HPPS measured 1445 us.  Let chrony choose on the honest numbers above
# rather than steering it with 'prefer'.

# Monitor with:
#   chronyc sources -v
#   chronyc sourcestats
