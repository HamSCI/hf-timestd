[services.profile]
title          = "Service profile"
help           = """Which services run on this host:

  full      All hf-timestd services (recorder + metrology + GNSS VTEC
            + T6 PPS + web UI).  Default for production.
  minimal   Recorder only.  Use for resource-constrained
            hosts where metrology isn't needed.
"""
example        = "full"
validator_hint = '"full" or "minimal"'
required       = false

